<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
    <title>Formulario | Cocteles Don Eustaquio</title>
</head>

<body>
    <header>
        <h1>Formulario de contacto</h1>
    </header>
    <nav>
        <a href="index.html">Inicio</a>
        <a href="blog.html">Blog</a>
        <a href="tabla.html">Cócteles</a>
        <a href="galeria.html">Galeria</a>
        <a href="formulario.html">Formulario</a>
    </nav>
    <main>
        <section>
            <h2>Cuéntanos tu experiencia</h2>
            <form>
                <fieldset>
                    <legend>Datos del consumidor</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <label for="correo">Correo Electronico:</label>
                    <input type="email" id="correo" name="correo" required>
                </fieldset>
                <fieldset>
                    <legend>Tus preferencias</legend>
                    <label for="coctel">¿Cúal probarías?</label>
                    <select id="coctel" name="coctel" required>
                        <option value="" disabled>Selecciona un cóctel</option>
                        <option value="oldFashioned">Old Fashioned</option>
                        <option value="negroni">Negroni</option>
                        <option value="mojito">Mojito</option>
                        <option value="martini">Martini</option>
                    </select>
                    <label for="opinion"> Valora mi pagina web, porfavor se honesto</label>
                    <textarea id="opinion" name="opinion" rows="5" required></textarea>
                </fieldset>
                <fieldset>
                    <legend>Privacidad</legend>

                    <input type="checkbox" id="privacidad" name="privacidad" required>
                    <label for="privacidad">Acepto la política de privacidad.</label>
                </fieldset>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Cócteles Don Eustaquio. Todos los derechos reservados. PR0201-HTML5</p>
    </footer>
</body>

</html>
